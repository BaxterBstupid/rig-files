<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rig Point Cloud</title>
<style>
  :root{ --bg:#0d1013; --panel:#161b21; --edge:#232b34; --ink:#eef2f4; --dim:#8a97a3; --amber:#f5c542; --green:#3ad17a; --red:#ff5a52;
    --font:"DejaVu Sans","Liberation Sans",system-ui,sans-serif; --mono:"DejaVu Sans Mono","Liberation Mono",monospace; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
  #view{position:fixed;inset:0}
  .hud{position:fixed;top:12px;left:12px;width:272px;background:rgba(22,27,33,.92);border:1px solid var(--edge);border-radius:10px;padding:10px 14px;font-family:var(--mono);font-size:13px;line-height:1.6}
  .hud b{color:var(--amber);font-family:var(--font);font-size:14px}
  .ok{color:var(--green)} .bad{color:var(--red)} .dim{color:var(--dim)} .warn{color:var(--amber)}
  .row{display:flex;align-items:center;gap:8px;margin-top:6px}
  .row label{width:74px;color:var(--dim);font-size:12px}
  .row input[type=range]{flex:1;accent-color:var(--amber)}
  .row .v{width:52px;text-align:right;font-size:12px}
  .modes{display:flex;gap:6px;margin:8px 0 2px}
  .modes button{flex:1;padding:7px 0;border:1px solid var(--edge);border-radius:8px;background:#10151a;color:var(--dim);font-family:var(--mono);font-size:13px}
  .modes button.on{background:#2a3140;color:var(--amber);border-color:var(--amber)}
  .act{width:100%;margin-top:8px;padding:9px 0;border:1px solid var(--edge);border-radius:8px;background:#1d2733;color:var(--ink);font-family:var(--mono);font-size:13px}
  .act:disabled{opacity:.45}
  .legend{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--dim)}
  .legend .bar{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#ff3326,#ffd933,#33cc59)}
  .help{position:fixed;bottom:10px;left:12px;color:#6b7680;font-size:12px}
</style>
</head>
<body>
<div id="view"></div>
<div class="hud"><b>L2 RIG VIEW</b><br>
  <span id="st" class="dim">connecting…</span><br>
  <span id="stats" class="dim"></span>
  <div class="modes">
    <button id="mSCAN" class="on">SCAN</button><button id="mMAP">MAP</button><button id="mMESH">MESH</button>
  </div>
  <div id="scanCtl">
    <div class="row"><label>point size</label><input id="sz" type="range" min="1" max="40" step="1"><span class="v" id="szv"></span></div>
    <div class="row"><label>decay</label><input id="dc" type="range" min="0" max="10" step="0.25"><span class="v" id="dcv"></span></div>
    <div class="row"><label>fade old</label><input id="fd" type="checkbox"><span class="dim" style="font-size:11px">dim older frames</span></div>
  </div>
  <div id="mapCtl" style="display:none">
    <div class="legend"><span>thin</span><div class="bar"></div><span>well-seen</span></div>
    <div class="row"><label>point size</label><input id="szm" type="range" min="1" max="40" step="1"><span class="v" id="szmv"></span></div>
  </div>
  <div id="meshCtl" style="display:none">
    <button id="runMesh" class="act">RUN MESH CHECK</button>
    <div class="legend"><span>thin</span><div class="bar"></div><span>well-seen</span></div>
    <span id="meshMsg" class="dim" style="font-size:12px"></span>
  </div>
  <div class="row" style="margin-top:10px"><label class="dim" style="width:auto;font-size:11px">ATTITUDE — level the view if needed</label></div>
  <div class="row"><label>roll X</label><input id="rx" type="range" min="-180" max="180" step="5"><span class="v" id="rxv"></span></div>
  <div class="row"><label>pitch Y</label><input id="ry" type="range" min="-180" max="180" step="5"><span class="v" id="ryv"></span></div>
  <div class="row"><label>yaw Z</label><input id="rz" type="range" min="-180" max="180" step="5"><span class="v" id="rzv"></span></div>
</div>
<div class="help">drag = orbit · wheel = zoom · right-drag = pan · settings are remembered</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---- settings (remembered) ----
const DEF={size:5, decay:2.0, fade:true, roll:0, pitch:0, yaw:0, mapsize:6, mode:"SCAN"};
function loadCfg(){ try{ return Object.assign({},DEF,JSON.parse(localStorage.getItem('rigcloud')||'{}')); }catch(e){ return Object.assign({},DEF); } }
function saveCfg(c){ try{ localStorage.setItem('rigcloud',JSON.stringify(c)); }catch(e){} }
const cfg=loadCfg();

// ---- pure logic (unit-tested in node) ----
function retainFrames(frames, decaySec){
  if(!frames.length) return frames;
  const tNew=frames[frames.length-1].t;
  if(decaySec<=0) return [frames[frames.length-1]];
  let i=0; while(i<frames.length-1 && (tNew-frames[i].t)>decaySec*1000) i++;
  return frames.slice(i);
}
function ageBrightness(ageMs, decaySec, fade){
  if(!fade || decaySec<=0) return 1;
  const a=Math.min(1, ageMs/(decaySec*1000)); return 1-0.75*a;
}
// coverage ramp: t 0..1 -> red -> yellow -> green (matches the mesh colours)
function covColor(t){ t=Math.min(1,Math.max(0,t));
  const R=[1,.2,.15], Y=[1,.85,.2], G=[.2,.8,.35];
  const mix=(a,b,f)=>[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
  return t<0.5 ? mix(R,Y,t/0.5) : mix(Y,G,(t-0.5)/0.5); }
// meshbin: 'RGM1' u32 nv u32 nf, f32 v*3, f32 c*3, u32 f*3
function parseMeshbin(buf){
  const dv=new DataView(buf);
  if(dv.getUint8(0)!==0x52||dv.getUint8(1)!==0x47||dv.getUint8(2)!==0x4D||dv.getUint8(3)!==0x31) throw new Error("bad magic");
  const nv=dv.getUint32(4,true), nf=dv.getUint32(8,true);
  let off=12;
  const verts=new Float32Array(buf,off,nv*3); off+=nv*12;
  const cols =new Float32Array(buf,off,nv*3); off+=nv*12;
  const faces=new Uint32Array(buf,off,nf*3); off+=nf*12;
  if(off!==buf.byteLength) throw new Error("size mismatch");
  return {nv,nf,verts,cols,faces};
}
if(typeof module!=='undefined'){ module.exports={retainFrames,ageBrightness,covColor,parseMeshbin}; }

(function(){
  if(typeof THREE==='undefined') return;
  const $=s=>document.querySelector(s);
  const W=()=>innerWidth, H=()=>innerHeight;
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(55, W()/H(), 0.05, 500); cam.up.set(0,0,1); cam.position.set(6,-6,4);
  const ren=new THREE.WebGLRenderer({antialias:false}); ren.setSize(W(),H()); ren.setClearColor(0x0d1013,1); $('#view').appendChild(ren.domElement);
  scene.add(new THREE.GridHelper(20,20,0x2a3440,0x1a2028).rotateX(Math.PI/2));
  scene.add(new THREE.AxesHelper(0.6));
  scene.add(new THREE.AmbientLight(0xffffff,0.55));
  const sun=new THREE.DirectionalLight(0xffffff,0.7); sun.position.set(4,-6,8); scene.add(sun);

  // orbit / zoom / pan
  let target=new THREE.Vector3(0,0,0), sph=new THREE.Spherical().setFromVector3(cam.position.clone().sub(target));
  let drag=null; const el=ren.domElement;
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('mousedown',e=>{drag={b:e.button,x:e.clientX,y:e.clientY}});
  addEventListener('mouseup',()=>drag=null);
  addEventListener('mousemove',e=>{ if(!drag)return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
    if(drag.b===0){ sph.theta-=dx*0.006; sph.phi=Math.min(Math.PI-0.05,Math.max(0.05,sph.phi-dy*0.006)); }
    else { const pan=new THREE.Vector3(-dx,dy,0).multiplyScalar(sph.radius*0.0015).applyQuaternion(cam.quaternion); target.add(pan); }
    update(); });
  el.addEventListener('wheel',e=>{ sph.radius*=Math.exp(e.deltaY*0.001); sph.radius=Math.max(0.5,Math.min(200,sph.radius)); update(); },{passive:true});
  function update(){ cam.position.setFromSpherical(sph).add(target); cam.lookAt(target); }
  update();
  let t0=null,d0=0;
  el.addEventListener('touchstart',e=>{ if(e.touches.length===1)t0={x:e.touches[0].clientX,y:e.touches[0].clientY}; if(e.touches.length===2)d0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); },{passive:true});
  el.addEventListener('touchmove',e=>{ if(e.touches.length===1&&t0){ const dx=e.touches[0].clientX-t0.x, dy=e.touches[0].clientY-t0.y; t0={x:e.touches[0].clientX,y:e.touches[0].clientY}; sph.theta-=dx*0.006; sph.phi=Math.min(Math.PI-0.05,Math.max(0.05,sph.phi-dy*0.006)); update(); }
    if(e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); sph.radius*=d0/d; d0=d; update(); } },{passive:true});
  addEventListener('resize',()=>{ cam.aspect=W()/H(); cam.updateProjectionMatrix(); ren.setSize(W(),H()); });

  // world group carrying the attitude
  const rig=new THREE.Group(); scene.add(rig);
  const d2r=d=>d*Math.PI/180;
  function applyAttitude(){ rig.rotation.set(d2r(cfg.roll), d2r(cfg.pitch), d2r(cfg.yaw), 'XYZ');
    $('#rxv').textContent=cfg.roll+'°'; $('#ryv').textContent=cfg.pitch+'°'; $('#rzv').textContent=cfg.yaw+'°'; }
  const rx=$('#rx'), ry=$('#ry'), rz=$('#rz'); rx.value=cfg.roll; ry.value=cfg.pitch; rz.value=cfg.yaw;
  rx.oninput=()=>{cfg.roll=+rx.value; applyAttitude(); saveCfg(cfg);};
  ry.oninput=()=>{cfg.pitch=+ry.value; applyAttitude(); saveCfg(cfg);};
  rz.oninput=()=>{cfg.yaw=+rz.value; applyAttitude(); saveCfg(cfg);};
  applyAttitude();

  // ---------- SCAN mode (live frames + decay) ----------
  const scanMat=new THREE.PointsMaterial({size:cfg.size/100, vertexColors:true, sizeAttenuation:true});
  let scanPts=null, scanGeo=null, scanCap=0, frames=[], imin=Infinity, imax=-Infinity;
  function turbo(t){ t=Math.min(1,Math.max(0,t));
    return [ 0.13+t*(4.6*t-4.2*t*t+0.4), 0.09+t*(2.9-2.3*t), 0.5+t*(1.6-2.6*t) ]; }
  function scanEnsure(n){ if(n<=scanCap && scanGeo) return; scanCap=Math.max(Math.ceil(n*1.5), 8192);
    if(scanPts){ rig.remove(scanPts); scanGeo.dispose(); }
    scanGeo=new THREE.BufferGeometry();
    scanGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(scanCap*3),3));
    scanGeo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(scanCap*3),3));
    scanPts=new THREE.Points(scanGeo,scanMat); rig.add(scanPts); }
  function scanRebuild(){
    frames=retainFrames(frames, cfg.decay);
    let total=0; for(const f of frames) total+=f.n;
    scanEnsure(total);
    const P=scanGeo.attributes.position.array, C=scanGeo.attributes.color.array;
    let lo=Infinity, hi=-Infinity;
    for(const f of frames){ const a=f.a; for(let i=0;i<f.n;i++){ const v=a[i*4+3]; if(v<lo)lo=v; if(v>hi)hi=v; } }
    if(isFinite(lo)){ imin=isFinite(imin)?imin*0.8+lo*0.2:lo; imax=isFinite(imax)?imax*0.8+hi*0.2:hi; }
    const span=(imax-imin)||1, tNew=frames.length?frames[frames.length-1].t:0;
    let k=0;
    for(const f of frames){
      const br=ageBrightness(tNew-f.t, cfg.decay, cfg.fade), a=f.a;
      for(let i=0;i<f.n;i++,k++){
        P[k*3]=a[i*4]; P[k*3+1]=a[i*4+1]; P[k*3+2]=a[i*4+2];
        const c=turbo((a[i*4+3]-imin)/span); C[k*3]=c[0]*br; C[k*3+1]=c[1]*br; C[k*3+2]=c[2]*br; } }
    scanGeo.setDrawRange(0,total); scanGeo.attributes.position.needsUpdate=true; scanGeo.attributes.color.needsUpdate=true;
    $('#stats').textContent=`pts ${total}  frames ${frames.length}`;
  }
  async function pollScan(){
    if(cfg.mode!=="SCAN") return;
    try{
      const r=await fetch('/cloud.bin?t='+Date.now(),{cache:'no-store'});
      if(r.status===503){ $('#st').textContent='waiting for LiDAR (rig off / not hot)'; $('#st').className='dim'; return; }
      const buf=await r.arrayBuffer(); const a=new Float32Array(buf); const n=(a.length/4)|0;
      frames.push({t:performance.now(), n, a}); scanRebuild();
      $('#st').textContent='SCAN LIVE'; $('#st').className='ok';
    }catch(e){ $('#st').textContent='no server'; $('#st').className='bad'; }
  }

  // ---------- MAP mode (accumulated coverage) ----------
  const mapMat=new THREE.PointsMaterial({size:cfg.mapsize/100, vertexColors:true, sizeAttenuation:true});
  let mapPts=null, mapGeo=null, mapCap=0;
  function mapEnsure(n){ if(n<=mapCap && mapGeo) return; mapCap=Math.max(Math.ceil(n*1.3), 8192);
    if(mapPts){ rig.remove(mapPts); mapGeo.dispose(); }
    mapGeo=new THREE.BufferGeometry();
    mapGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(mapCap*3),3));
    mapGeo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(mapCap*3),3));
    mapPts=new THREE.Points(mapGeo,mapMat); mapPts.visible=false; rig.add(mapPts); }
  async function pollMap(){
    if(cfg.mode!=="MAP") return;
    try{
      const r=await fetch('/map.bin?t='+Date.now(),{cache:'no-store'});
      const vox=r.headers.get('X-Voxels')||'?', capped=r.headers.get('X-Capped')==='1';
      const buf=await r.arrayBuffer(); const a=new Float32Array(buf); const n=(a.length/4)|0;
      mapEnsure(n); mapPts.visible=true;
      const P=mapGeo.attributes.position.array, C=mapGeo.attributes.color.array;
      let hi=1; for(let i=0;i<n;i++) hi=Math.max(hi, a[i*4+3]);
      const denom=Math.log2(1+hi)||1;
      for(let i=0;i<n;i++){
        P[i*3]=a[i*4]; P[i*3+1]=a[i*4+1]; P[i*3+2]=a[i*4+2];
        const c=covColor(Math.log2(1+a[i*4+3])/denom);
        C[i*3]=c[0]; C[i*3+1]=c[1]; C[i*3+2]=c[2]; }
      mapGeo.setDrawRange(0,n); mapGeo.attributes.position.needsUpdate=true; mapGeo.attributes.color.needsUpdate=true;
      $('#st').textContent='MAP LIVE'; $('#st').className='ok';
      $('#stats').textContent=`voxels ${vox}${capped?'  CAPPED':''} shown ${n}`;
      if(capped){ $('#stats').className='warn'; } else { $('#stats').className='dim'; }
    }catch(e){ $('#st').textContent='no server'; $('#st').className='bad'; }
  }

  // ---------- MESH mode ----------
  let meshObj=null, meshPoll=null;
  function setMeshMsg(t,cls){ $('#meshMsg').textContent=t; $('#meshMsg').className=cls||'dim'; }
  async function loadMesh(){
    try{
      const r=await fetch('/mesh.bin?t='+Date.now(),{cache:'no-store'});
      if(!r.ok){ setMeshMsg('no mesh yet — RUN MESH CHECK'); return; }
      const m=parseMeshbin(await r.arrayBuffer());
      if(meshObj){ rig.remove(meshObj); meshObj.geometry.dispose(); }
      const g=new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(m.verts,3));
      g.setAttribute('color',    new THREE.BufferAttribute(m.cols,3));
      g.setIndex(new THREE.BufferAttribute(m.faces,1));
      g.computeVertexNormals();
      meshObj=new THREE.Mesh(g, new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide}));
      meshObj.visible=(cfg.mode==="MESH"); rig.add(meshObj);
      $('#stats').textContent=`mesh ${m.nv.toLocaleString()} v ${m.nf.toLocaleString()} f`;
      setMeshMsg('mesh loaded — red = walk here again','ok');
    }catch(e){ setMeshMsg('mesh load failed: '+e.message,'bad'); }
  }
  $('#runMesh').onclick=async()=>{
    $('#runMesh').disabled=true; setMeshMsg('starting…');
    try{
      const r=await fetch('/action?do=meshcheck'); const j=await r.json();
      if(j.ok===false){ setMeshMsg(j.err,'bad'); $('#runMesh').disabled=false; return; }
      meshPoll=setInterval(async()=>{
        const s=await (await fetch('/meshstatus')).json();
        if(s.state==='running'){ setMeshMsg(`meshing… ${s.elapsed}s`); }
        else if(s.state==='done'){ clearInterval(meshPoll); $('#runMesh').disabled=false;
          setMeshMsg(`done in ${s.meta.seconds}s`); loadMesh(); }
        else if(s.state==='error'){ clearInterval(meshPoll); $('#runMesh').disabled=false; setMeshMsg('error: '+s.err,'bad'); }
      },1000);
    }catch(e){ setMeshMsg('failed: '+e.message,'bad'); $('#runMesh').disabled=false; }
  };

  // ---------- mode switching ----------
  function setMode(m){
    cfg.mode=m; saveCfg(cfg);
    for(const id of ['SCAN','MAP','MESH']) $('#m'+id).className=(id===m)?'on':'';
    $('#scanCtl').style.display=(m==='SCAN')?'':'none';
    $('#mapCtl').style.display=(m==='MAP')?'':'none';
    $('#meshCtl').style.display=(m==='MESH')?'':'none';
    if(scanPts) scanPts.visible=(m==='SCAN');
    if(mapPts) mapPts.visible=(m==='MAP');
    if(meshObj) meshObj.visible=(m==='MESH');
    if(m==='MESH'){ loadMesh(); }
  }
  $('#mSCAN').onclick=()=>setMode('SCAN'); $('#mMAP').onclick=()=>setMode('MAP'); $('#mMESH').onclick=()=>setMode('MESH');

  // ---------- controls ----------
  const sz=$('#sz'), dc=$('#dc'), fd=$('#fd'), szm=$('#szm');
  sz.value=cfg.size; dc.value=cfg.decay; fd.checked=cfg.fade; szm.value=cfg.mapsize;
  function showVals(){ $('#szv').textContent=(cfg.size/100).toFixed(2)+' m'; $('#dcv').textContent=cfg.decay.toFixed(2)+' s'; $('#szmv').textContent=(cfg.mapsize/100).toFixed(2)+' m'; }
  sz.oninput=()=>{ cfg.size=+sz.value; scanMat.size=cfg.size/100; showVals(); saveCfg(cfg); };
  dc.oninput=()=>{ cfg.decay=+dc.value; showVals(); saveCfg(cfg); scanRebuild(); };
  fd.onchange=()=>{ cfg.fade=fd.checked; saveCfg(cfg); scanRebuild(); };
  szm.oninput=()=>{ cfg.mapsize=+szm.value; mapMat.size=cfg.mapsize/100; showVals(); saveCfg(cfg); };
  showVals();

  setInterval(pollScan, 160);
  setInterval(pollMap, 2000);
  setMode(cfg.mode||'SCAN');
  (function loop(){ requestAnimationFrame(loop); ren.render(scene,cam); })();
})();
</script>
</body>
</html>
